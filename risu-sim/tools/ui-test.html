<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>UI-TEST</title>
<style>
  body { font: 12px/1.5 ui-monospace, monospace; background: #0b0e14; color: #d6deeb; margin: 0; }
  iframe { width: 1400px; height: 900px; border: 1px solid #333; }
  #out { white-space: pre-wrap; padding: 10px; }
</style>
</head>
<body>
<iframe id="frame" src="../index.html"></iframe>
<pre id="out">RUNNING</pre>
<script>
(function () {
  'use strict';
  var lines = [];
  var fails = 0;

  function log(s) { lines.push(s); }
  function ok(name, cond, extra) {
    if (!cond) fails++;
    log((cond ? 'PASS ' : 'FAIL ') + name + (extra != null && !cond ? '  → ' + extra : ''));
  }
  function eq(name, a, b) {
    ok(name, a === b, 'expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a));
  }
  function flush() {
    var el = document.getElementById('out');
    el.textContent = (fails === 0 ? 'ALL PASS' : fails + ' FAILED') + ' (' + lines.length + ' checks)\n\n' + lines.join('\n');
    document.title = fails === 0 ? 'ALLPASS' : 'FAILED-' + fails;
  }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function until(fn, ms) {
    var t0 = Date.now();
    while (Date.now() - t0 < (ms || 6000)) {
      var v = fn();
      if (v) return v;
      await sleep(40);
    }
    return null;
  }

  var frame = document.getElementById('frame');
  var errors = [];

  frame.addEventListener('load', function () {
    var w = frame.contentWindow;
    var d = frame.contentDocument;
    w.addEventListener('error', function (e) { errors.push('error: ' + (e.message || e)); });
    w.addEventListener('unhandledrejection', function (e) { errors.push('rejection: ' + (e.reason && e.reason.message || e.reason)); });
    var origErr = w.console.error;
    w.console.error = function () {
      errors.push('console.error: ' + Array.prototype.map.call(arguments, function (a) {
        return (a && a.message) || String(a);
      }).join(' '));
      return origErr.apply(w.console, arguments);
    };

    main(w, d).then(function () {
      ok('JS 오류 없음', errors.length === 0, errors.join(' | '));
      // 엔진 상태
      var stat = d.getElementById('stat').textContent;
      ok('Lua WASM 준비됨', /Lua WASM ready/.test(stat), stat);
      ok('정규식 스크립트 실행됨', /실행된 스크립트 \d+/.test(stat), stat);
      flush();
    }).catch(function (e) {
      fails++;
      log('EXCEPTION ' + ((e && e.stack) || e));
      flush();
    });
  });

  function fileNameFrom(kind) { return kind; }

  async function feed(w, d, kind, fixtures, names) {
    var input = d.getElementById('file-' + kind);
    var dt = new w.DataTransfer();
    for (var i = 0; i < fixtures.length; i++) {
      dt.items.add(new w.File([fixtures[i].bytes], names ? names[i] : fixtures[i].name));
    }
    input.files = dt.files;
    input.dispatchEvent(new w.Event('change', { bubbles: true }));
    // importMsg 가 '읽는 중' 이 아닐 때까지 대기
    await until(function () {
      return !/읽는 중/.test(d.getElementById('importMsg').textContent);
    }, 10000);
    await sleep(250);
    log('   [importMsg ' + kind + '] ' + d.getElementById('importMsg').textContent.replace(/\n/g, ' ⏎ '));
  }

  async function fetchFixtures(names) {
    var out = [];
    for (var i = 0; i < names.length; i++) {
      var r = await fetch('fixtures/' + names[i]);
      out.push({ name: names[i], bytes: new Uint8Array(await r.arrayBuffer()) });
    }
    return out;
  }

  async function main(w, d) {
    await until(function () { return /실행된 스크립트/.test(d.getElementById('stat').textContent); }, 8000);

    var F = await fetchFixtures([
      'fixture-preset.risup',
      'fixture-preset-old.risupreset',
      'fixture-bot.charx',
      'fixture-bot.png',
      'fixture-module.module',
      'fixture-module.risum',
      'fixture-bot-nomod.charx'
    ]);
    var byName = {};
    F.forEach(function (f) { byName[f.name] = f; });

    function json(id) { return JSON.parse(d.getElementById(id).value || '[]'); }
    function items(kind) { return d.querySelectorAll('#list-' + kind + ' .ib-item').length; }

    // ---------- 프리셋 ----------
    eq('처음엔 프리셋 목록이 비어 있음', items('preset'), 0);
    await feed(w, d, 'preset', [byName['fixture-preset.risup']]);
    eq('프리셋 1개 등록', items('preset'), 1);
    eq('프리셋 정규식 2개 적용', json('presetRegex').length, 2);
    eq('프리셋 정규식 comment 유지', json('presetRegex')[0].comment, '프리셋: 앞에 배지');
    eq('프리셋 첫 항목이 적용 중', d.querySelectorAll('#list-preset .ib-item.applied').length, 1);

    await feed(w, d, 'preset', [byName['fixture-preset-old.risupreset']]);
    eq('프리셋 2개 등록', items('preset'), 2);
    eq('한 번에 하나만 선택(라디오)', d.querySelectorAll('#list-preset input[type="radio"]').length, 2);
    eq('라디오 체크는 1개', d.querySelectorAll('#list-preset input[type="radio"]:checked').length, 1);

    // ---------- 봇 카드 ----------
    eq('처음엔 봇 목록이 비어 있음', items('character'), 0);
    await feed(w, d, 'character', [byName['fixture-bot.charx']]);
    eq('봇 1개 등록', items('character'), 1);
    eq('봇 이름 반영', d.getElementById('charName').value, 'FixtureBot');
    ok(
      '채팅 내용 = 퍼스트메시지',
      d.getElementById('input').value.indexOf('*{{char}} 가 고개를 든다.*') === 0,
      d.getElementById('input').value.slice(0, 60)
    );
    eq('봇 정규식 1개', json('charRegex').length, 1);
    eq('봇 트리거 1개', json('charTriggers').length, 1);
    eq('봇 Lua 트리거 1개', json('charLua').length, 1);
    eq('봇 에셋 이름 2개', d.getElementById('assetNames').value.split('\n').length, 2);
    eq('봇 기본 변수 hp', JSON.parse(d.getElementById('vars').value).hp, '42');

    await feed(w, d, 'character', [byName['fixture-bot.png']]);
    eq('봇 2개 등록', items('character'), 2);
    eq('봇도 라디오 1개만', d.querySelectorAll('#list-character input[type="radio"]:checked').length, 1);
    eq('PNG 봇으로 교체', d.getElementById('charName').value, 'PngBot');
    eq('PNG 봇 정규식 1개', json('charRegex').length, 1);
    eq('PNG 봇 트리거 0개', json('charTriggers').length, 0);

    // 첫 항목 다시 선택
    d.querySelector('#list-character .ib-item').click();
    await sleep(300);
    eq('목록 클릭으로 이전 봇 재선택', d.getElementById('charName').value, 'FixtureBot');

    // ---------- 모듈 ----------
    eq('처음엔 모듈 목록이 비어 있음', items('module'), 0);
    await feed(w, d, 'module', [byName['fixture-module.module'], byName['fixture-module.risum']]);
    eq('모듈 2개 등록', items('module'), 2);
    eq('모듈은 체크박스', d.querySelectorAll('#list-module input[type="checkbox"]').length, 2);
    eq('모듈 2개 모두 체크', d.querySelectorAll('#list-module input[type="checkbox"]:checked').length, 2);
    eq('모듈 정규식 합쳐짐', json('moduleRegex').length, 2);
    eq('모듈 트리거 합쳐짐', json('moduleTriggers').length, 2);
    eq('모듈 order 플래그 보존', json('moduleRegex')[0].flag.indexOf('<order 10>') >= 0, true);

    // 하나 해제
    d.querySelector('#list-module .ib-item').click();
    await sleep(300);
    eq('모듈 1개만 체크', d.querySelectorAll('#list-module input[type="checkbox"]:checked').length, 1);
    eq('모듈 정규식 1개로', json('moduleRegex').length, 1);

    // 다시 체크
    d.querySelector('#list-module .ib-item').click();
    await sleep(300);
    eq('다시 체크', json('moduleRegex').length, 2);

    // ---------- 실행 결과 ----------
    d.getElementById('runBtn').click();
    await sleep(1200);

    var stat = d.getElementById('stat').textContent;
    ok('최종 길이 계산됨', /최종 길이 \d+/.test(stat), stat);
    ok('미지원 CBS 없음', !/미지원 CBS/.test(stat), stat);

    var html = d.getElementById('htmlOut').textContent;
    ok('봇 CSS 가 .chattext 하위로 스코프됨', html.indexOf('x-risu-') >= 0, html.slice(0, 200));
    ok('프리셋 정규식 결과 포함', html.indexOf('x-risu-pbadge') >= 0, html.slice(0, 300));
    ok('모듈 정규식 결과(HP 강조) 포함', /HP:/.test(html), html.slice(0, 300));

    var preview = d.getElementById('preview');
    ok('프리뷰가 비어 있지 않음', preview.textContent.trim().length > 0, preview.textContent.slice(0, 80));
    ok('머리말은 봇 발화', d.getElementById('chatName').textContent.indexOf('입력 단계') < 0,
      d.getElementById('chatName').textContent);
    eq('머리말 이름 = 봇 이름', d.getElementById('chatName').textContent, 'FixtureBot');
    ok('말풍선 제거(전체 폭)', !d.querySelector('.bubble'), 'bubble exists');
    // 카드에 아이콘 에셋이 있으면 아바타가 이미지로 바뀐다 (없으면 첫 글자)
    ok('아바타: 글자 또는 아이콘',
      d.getElementById('chatAvatar').textContent === 'F' ||
        /url\("blob:/.test(d.getElementById('chatAvatar').style.backgroundImage),
      'text=' + JSON.stringify(d.getElementById('chatAvatar').textContent) +
        ' bg=' + d.getElementById('chatAvatar').style.backgroundImage);

    // ---------- 보기 모드 (실제 이미지 / HTML 코드) ----------
    function viewBtn(mode) { return d.querySelector('#viewSeg button[data-view="' + mode + '"]'); }
    ok('보기 모드 기본 = 실제 이미지', viewBtn('image').classList.contains('active'),
      d.getElementById('viewSeg').innerHTML.slice(0, 120));
    ok('실제 이미지 모드에서 프리뷰 표시', !d.getElementById('previewWrap').classList.contains('hide'));
    ok('실제 이미지 모드에서 HTML 숨김', !d.getElementById('htmlOut').classList.contains('show'));
    var lazyBefore = d.querySelectorAll('#pane-trace .lazy-after').length;
    ok('접힌 칸의 After 렌더는 미뤄 둠 (펼칠 때 그림)', lazyBefore > 0, 'lazy=' + lazyBefore);
    // 모든 칸을 펼치면 그때 그려진다 (toggle 이벤트)
    for (var pass = 0; pass < 3; pass++) {
      Array.prototype.forEach.call(d.querySelectorAll('#pane-trace details:not(.srcbox)'), function (el) { el.open = true; });
      await sleep(200);
    }
    ok('펼치면 모두 렌더됨', d.querySelectorAll('#pane-trace .lazy-after').length === 0,
      'left=' + d.querySelectorAll('#pane-trace .lazy-after').length);
    var rendered = d.querySelectorAll('#pane-trace .rendered');
    ok('After 렌더 블록이 생성됨', rendered.length > 0, 'count=' + rendered.length);
    ok('소스 보기 토글 존재', d.querySelectorAll('#pane-trace details.srcbox').length > 0,
      String(d.querySelectorAll('#pane-trace details.srcbox').length));

    var allHtml = Array.prototype.map.call(rendered, function (el) { return el.innerHTML; }).join('\n');
    ok('카드 CSS 가 블록 스코프(.simscope-N)로 들어감', /\.simscope-\d+ \.x-risu-/.test(allHtml),
      allHtml.slice(0, 260));

    // 에셋 태그가 붙은 메시지로 렌더 확인 (정확 일치 + 퍼지 매칭)
    d.getElementById('input').value = '*웃는다*\n\n{{asset::smile_happy.png}} 그리고 {{asset::angryy.png}}';
    d.getElementById('runBtn').click();
    await sleep(1500);
    var all2 = Array.prototype.map.call(d.querySelectorAll('#pane-trace .rendered'), function (el) {
      return el.innerHTML;
    }).join('\n');
    ok('에셋 자리표시자 렌더', /class="x-risu-sim-asset"/.test(all2), all2.slice(0, 400));
    ok('에셋 이름 표시', /smile_happy\.png/.test(all2), all2.slice(0, 400));
    ok('에셋 퍼지 매칭(angryy→angry.png)', /angry\.png/.test(all2), all2.slice(0, 500));

    // HTML 코드 모드로 전환
    viewBtn('html').click();
    await sleep(1500);
    ok('HTML 모드 active', viewBtn('html').classList.contains('active'));
    ok('HTML 모드에서 프리뷰 숨김', d.getElementById('previewWrap').classList.contains('hide'));
    ok('HTML 모드에서 코드 표시', d.getElementById('htmlOut').classList.contains('show'));
    ok('코드에 최종 HTML 이 들어있음', d.getElementById('htmlOut').textContent.length > 20,
      d.getElementById('htmlOut').textContent.slice(0, 120));
    eq('HTML 모드에서는 After 렌더 블록 없음', d.querySelectorAll('#pane-trace .rendered').length, 0);
    ok('HTML 모드에서도 after 소스는 남음', /diff-after/.test(d.getElementById('pane-trace').innerHTML));

    // 실제 이미지 모드로 복귀
    viewBtn('image').click();
    await sleep(1500);
    ok('이미지 모드 복귀 시 렌더 블록 생성', d.querySelectorAll('#pane-trace .rendered').length > 0);
    ok('이미지 모드 복귀 시 프리뷰 표시', !d.getElementById('previewWrap').classList.contains('hide'));

    // ---------- 페이지 아무 데나 드롭 (전역 라우팅) ----------
    var beforeChar = items('character');
    var beforeMod = items('module');
    var dropDt = new w.DataTransfer();
    dropDt.items.add(new w.File([byName['fixture-bot-nomod.charx'].bytes], 'fixture-bot-nomod.charx'));
    dropDt.items.add(new w.File([byName['fixture-module.risum'].bytes], 'fixture-module.risum'));
    d.body.dispatchEvent(new w.DragEvent('drop', { dataTransfer: dropDt, bubbles: true, cancelable: true }));
    await until(function () { return items('character') > beforeChar; }, 8000);
    await sleep(400);
    ok('페이지 어디에 떨어뜨려도 봇으로 분류', items('character') === beforeChar + 1,
      'before=' + beforeChar + ' after=' + items('character'));
    ok('같은 드롭에서 모듈도 분류', items('module') === beforeMod + 1,
      'before=' + beforeMod + ' after=' + items('module'));

    // ---------- first_mes 가 비어 있으면 대체 인사로 ----------
    var nog = await (await fetch('fixtures/fixture-nogreeting.json')).arrayBuffer();
    var nogInput = d.getElementById('file-character');
    var nogDt = new w.DataTransfer();
    nogDt.items.add(new w.File([new Uint8Array(nog)], 'fixture-nogreeting.json'));
    nogInput.files = nogDt.files;
    nogInput.dispatchEvent(new w.Event('change', { bubbles: true }));
    await until(function () { return !/읽는 중/.test(d.getElementById('importMsg').textContent); }, 8000);
    await sleep(300);
    // 원본은 빈 first_mes 를 대체 인사로 바꾸지 않는다
    eq('빈 first_mes 는 빈 입력', d.getElementById('input').value, '');

    // 원본과 같은 메시지 컨테이너 / 배경 레이어 위치
    var pv = d.getElementById('preview');
    eq('본문 컨테이너 클래스 (Chat.svelte:540)', pv.className, 'text chat-width chattext prose prose-invert minw-0');
    ok('배경 레이어는 .chattext 밖', !d.getElementById('bgLayer').closest('.chattext'));
    ok('RisuAI 채팅 CSS 로드 (FontColorStandard)', w.getComputedStyle(d.querySelector('.risu-scope')).getPropertyValue('--FontColorStandard').trim() === '#fafafa');
    ok('vendor 번들 로드', !!(w.RisuCore && w.RisuCore.markdownit && w.RisuCBS));
    ok('경고 배지 표시', d.querySelectorAll('#list-character .ib-item .warn').length > 0);

    // ---------- HTML 카드 UI: 중첩 #when + 실제 이미지 ----------
    var cardui = await (await fetch('fixtures/fixture-cardui.charx')).arrayBuffer();
    var ci = d.getElementById('file-character');
    var ciDt = new w.DataTransfer();
    ciDt.items.add(new w.File([new Uint8Array(cardui)], 'fixture-cardui.charx'));
    ci.files = ciDt.files;
    ci.dispatchEvent(new w.Event('change', { bubbles: true }));
    await until(function () { return !/읽는 중/.test(d.getElementById('importMsg').textContent); }, 12000);
    await sleep(600);
    d.getElementById('runBtn').click();
    await sleep(1500);

    var ciHtml = d.getElementById('htmlOut').textContent;
    var ciCss = d.getElementById('cssOut').textContent;
    var ciFinal = d.getElementById('input').value;

    eq('카드 UI 봇 이름', d.getElementById('charName').value, 'CardUiBot');
    ok('남은 CBS 태그 없음', ciHtml.indexOf('{{') < 0, ciHtml.slice(0, 300));
    ok('중첩 #when 통과 → 제목 버튼', /x-risu-fm-title-btn/.test(ciHtml), ciHtml.slice(0, 300));
    ok('중첩 #when 참 분기 렌더', /x-risu-fm-sub-ti/.test(ciHtml), ciHtml.slice(0, 400));
    ok('실제 이미지 <img src=blob:', /<img src="blob:/.test(ciHtml), ciHtml.slice(0, 500));
    ok('CSS url(blob:) 로 배경 적용', /url\(blob:/.test(ciCss), ciCss.slice(0, 300));
    ok('아바타에 카드 아이콘', /url\("blob:/.test(d.getElementById('chatAvatar').style.backgroundImage),
      d.getElementById('chatAvatar').style.backgroundImage);
    ok('blob: URL 이 실제로 살아 있음', (function () {
      var m = /<img src="(blob:[^"]+)"/.exec(ciHtml);
      return !!m && m[1].length > 10;
    })(), ciHtml.slice(0, 300));

    // 다시 적용해도(선택 클릭) 같은 blob URL 을 계속 쓴다 — 이미지 재디코딩 없음
    var srcBefore = (/<img src="(blob:[^"]+)"/.exec(ciHtml) || [])[1];
    var selRow = d.querySelector('#list-character .ib-item.applied') || d.querySelector('#list-character .ib-item');
    selRow.click();
    await sleep(1500);
    var srcAfter = (/<img src="(blob:[^"]+)"/.exec(d.getElementById('htmlOut').textContent) || [])[1];
    ok('다시 적용해도 에셋 blob URL 유지', !!srcBefore && srcBefore === srcAfter, srcBefore + ' / ' + srcAfter);

    // ---------- 카드 배경 (backgroundHTML) ----------
    var bg = d.getElementById('bgLayer');
    ok('배경 레이어에 내용이 있음', bg.innerHTML.length > 10, bg.innerHTML.slice(0, 200));
    ok('배경 CSS 가 스코프됨', /\.chattext \.x-risu-bgwrap/.test(bg.innerHTML), bg.innerHTML.slice(0, 300));
    ok('배경 이미지가 실제 blob URL', /url\(blob:/.test(bg.innerHTML), bg.innerHTML.slice(0, 300));

    // ---------- 모듈 토글 / 버튼 트리거 / 변수 편집 ----------
    // (카드 UI 봇: toggles=cot(체크박스), tone(select), note(text), 트리거 'open')
    ok('모듈 토글 패널 표시', d.getElementById('toggleField').style.display !== 'none',
      d.getElementById('toggleField').style.display);
    var cot = d.querySelector('#toggleHost input[type="checkbox"][data-tkey="cot"]');
    ok('체크박스 토글 생성', !!cot);
    var tone = d.querySelector('#toggleHost select[data-tkey="tone"]');
    ok('select 토글 생성', !!tone && tone.options.length === 2, tone ? tone.options.length : 'null');
    var note = d.querySelector('#toggleHost input[type="text"][data-tkey="note"]');
    ok('text 토글 생성', !!note);

    // 체크박스 끄기 → toggle_cot=0 → COT 사라짐, 켜기 → 다시 나타남
    function cotRendered() { return d.getElementById('htmlOut').textContent.indexOf('x-risu-cot') >= 0; }
    cot = d.querySelector('#toggleHost input[type="checkbox"][data-tkey="cot"]');
    cot.checked = false;
    cot.dispatchEvent(new w.Event('change', { bubbles: true }));
    await sleep(1800);
    ok('토글 끄면 COT 사라짐', !cotRendered(), d.getElementById('htmlOut').textContent.slice(0, 400));
    ok('toggle_cot=0 저장', JSON.parse(d.getElementById('globalVars').value).toggle_cot === '0',
      d.getElementById('globalVars').value.slice(0, 120));

    cot = d.querySelector('#toggleHost input[type="checkbox"][data-tkey="cot"]');
    cot.checked = true;
    cot.dispatchEvent(new w.Event('change', { bubbles: true }));
    await sleep(1800);
    ok('토글 켜면 COT 렌더', cotRendered(),
      d.getElementById('htmlOut').textContent.slice(0, 400));
    ok('전역 변수에 toggle_cot=1', JSON.parse(d.getElementById('globalVars').value).toggle_cot === '1',
      d.getElementById('globalVars').value.slice(0, 120));

    // select 토글
    tone = d.querySelector('#toggleHost select[data-tkey="tone"]');
    tone.value = '1';
    tone.dispatchEvent(new w.Event('change', { bubbles: true }));
    await sleep(1500);
    ok('select 토글 값 반영', JSON.parse(d.getElementById('globalVars').value).toggle_tone === '1',
      d.getElementById('globalVars').value.slice(0, 160));

    // 프리셋 → 모듈 → 캐릭터 토글이 한 패널에 원본 순서로 (Toggles.svelte:71)
    var tkeys = Array.prototype.map.call(d.querySelectorAll('#toggleHost [data-tkey]'), function (el) { return el.getAttribute('data-tkey'); });
    ok('프리셋 토글도 표시', tkeys.indexOf('ptog') >= 0 && tkeys.indexOf('pmode') >= 0, tkeys.join(','));
    ok('프리셋 토글이 캐릭터 토글보다 먼저', tkeys.indexOf('ptog') >= 0 && tkeys.indexOf('ptog') < tkeys.indexOf('cot'), tkeys.join(','));
    ok('토글 안 건드리면 toggle_* 값을 만들지 않음', !('toggle_ptog' in JSON.parse(d.getElementById('globalVars').value || '{}')),
      d.getElementById('globalVars').value.slice(0, 160));

    // 버튼 트리거: <button risu-trigger="open"> → 발동 시 revealed=1
    ok('버튼 트리거 전에는 OPENED 없음', d.getElementById('htmlOut').textContent.indexOf('x-risu-revealed') < 0);
    var btn = d.querySelector('#preview [risu-trigger]');
    ok('프리뷰에 risu-trigger 버튼 존재', !!btn, d.getElementById('preview').innerHTML.slice(0, 200));
    btn = d.querySelector('#preview [risu-trigger]');
    btn.click();
    await sleep(2000);
    ok('버튼 트리거 실행 후 OPENED 렌더', d.getElementById('htmlOut').textContent.indexOf('x-risu-revealed') >= 0,
      d.getElementById('htmlOut').textContent.slice(0, 400));
    ok('트리거 trace 에 manual 패스', /버튼 트리거/.test(d.getElementById('pane-trace').textContent),
      d.getElementById('pane-trace').textContent.slice(0, 200));
    ok('채팅 변수 revealed=1', JSON.parse(d.getElementById('vars').value).revealed === '1',
      d.getElementById('vars').value);

    // 변수 편집기
    var rows = d.querySelectorAll('#varRowsChat .varrow');
    ok('변수 편집기 행 생성', rows.length > 0, String(rows.length));
    var valInput = d.querySelector('#varRowsChat .varrow input[data-part="val"]');
    valInput.value = 'X1';
    valInput.dispatchEvent(new w.Event('change', { bubbles: true }));
    await sleep(1200);

    // 기능 토글: 트리거 끄기
    var beforeTrace = d.getElementById('pane-trace').textContent.length;
    d.getElementById('featTriggers').checked = false;
    d.getElementById('featTriggers').dispatchEvent(new w.Event('change', { bubbles: true }));
    d.getElementById('featTriggers').dispatchEvent(new w.Event('input', { bubbles: true }));
    await sleep(2000);
    ok('트리거 끄면 trace 에 사용 안 함', /사용 안 함/.test(d.getElementById('pane-trace').textContent),
      d.getElementById('pane-trace').textContent.slice(0, 300));
    d.getElementById('featTriggers').checked = true;
    d.getElementById('featTriggers').dispatchEvent(new w.Event('change', { bubbles: true }));
    d.getElementById('featTriggers').dispatchEvent(new w.Event('input', { bubbles: true }));
    await sleep(1500);

    // ---------- textarea 직접 수정 → 적용 표시 해제 ----------
    var ta = d.getElementById('charRegex');
    ta.value = '[]';
    ta.dispatchEvent(new w.Event('input', { bubbles: true }));
    await sleep(400);
    eq('수동 수정 시 적용 표시 해제', d.querySelectorAll('#list-character .ib-item.applied').length, 0);

    // ---------- 잘못된 파일 ----------
    var bad = await fetchFixtures(['fixture-module.risum']);
    var input = d.getElementById('file-preset');
    var dt = new w.DataTransfer();
    dt.items.add(new w.File([bad[0].bytes], 'fixture-module.risum'));
    input.files = dt.files;
    input.dispatchEvent(new w.Event('change', { bubbles: true }));
    await until(function () {
      return !/읽는 중/.test(d.getElementById('importMsg').textContent);
    }, 10000);
    await sleep(150);
    ok('프리셋 칸에 모듈을 넣으면 거부', /실패|프리셋이 아닙니다/.test(d.getElementById('importMsg').textContent),
      d.getElementById('importMsg').textContent);
    eq('거부되어도 목록은 그대로', items('preset'), 2);

    // ---------- 제거 ----------
    var beforeRemove = items('module');
    var beforeRegex = json('moduleRegex').length;
    d.querySelector('#list-module .ib-item .x').click();
    await sleep(300);
    eq('모듈 제거', items('module'), beforeRemove - 1);
    ok('남은 모듈 정규식도 줄어듬', json('moduleRegex').length < beforeRegex,
      beforeRegex + ' -> ' + json('moduleRegex').length);

    // ---------- 실제 Lua (wasmoon) — 원본 래퍼/브리지 의미 ----------
    var lua = function (code) { return { comment: 'lua', type: 'manual', conditions: [], effect: [{ type: 'triggerlua', code: code }] }; };
    var r1 = await w.RisuSim.run({
      mode: 'editdisplay', input: 'X', markdown: false,
      charLua: [lua("listenEdit('editDisplay', function(id, v, meta) return v .. '|' .. getChatVar(id, 'nope') .. '|' .. getChatVar(id, 'hp') .. '|' .. tostring(meta.index) end)")],
      vars: { hp: '7' }
    });
    eq('Lua getChatVar 없는 키 → "null", 같은 저장소, meta.index = chatID', r1.finalText, 'X|null|7|-1');
    var r2 = await w.RisuSim.run({
      mode: 'editoutput', input: 'A', markdown: false,
      // callListenMain 자체가 async 코루틴이라 안에서 :await() 를 쓸 수 있다 (원본 래퍼)
      charLua: [lua("listenEdit('editOutput', function(id, v) setChatVar(id, 'k', 'v1') return async(function() return v .. '!' end)():await() end)")]
    });
    eq('Lua async(...) + :await() 동작', r2.finalText, 'A!');
    eq('Lua setChatVar → scriptstate', r2.scriptstateAfter['$k'], 'v1');
    var r3 = await w.RisuSim.run({
      mode: 'editdisplay', input: 'Q', markdown: false,
      charLua: [lua("listenEdit('editDisplay', function(id, v) return v .. 'Z' end) this is a syntax error")]
    });
    eq('Lua 로드 오류 → 원본처럼 훅 전체 취소', r3.finalText, 'Q');
    var r4 = await w.RisuSim.run({
      mode: 'editdisplay', input: 'C', markdown: false,
      charLua: [lua("counter = (counter or 0) + 1  listenEdit('editDisplay', function(id, v) return v .. counter end)")]
    });
    var r5 = await w.RisuSim.run({
      mode: 'editdisplay', input: 'C', markdown: false,
      charLua: [lua("counter = (counter or 0) + 1  listenEdit('editDisplay', function(id, v) return v .. counter end)")]
    });
    eq('같은 코드면 mode 엔진 재사용 (전역 유지 X — 코드 재실행 안 함)', r4.finalText + ',' + r5.finalText, 'C1,C1');

    // ---------- 원본 runTrigger + Lua lowLevelAccess ----------
    var llTrig = function () { return [{ comment: 'x', type: 'start', conditions: [], effect: [{ type: 'extractRegex', value: 'HP 42', regex: '(\\d+)', flags: '', result: '$1', inputVar: 'hp' }] }]; };
    var t1 = await w.RisuSim.run({ mode: 'editprocess', input: 'a', chatID: 0, chat: [{ role: 'char', data: 'a' }], charTriggers: llTrig() });
    var t2 = await w.RisuSim.run({ mode: 'editprocess', input: 'a', chatID: 0, chat: [{ role: 'char', data: 'a' }], charTriggers: llTrig(), charLowLevelAccess: true });
    eq('lowLevelAccess 없으면 extractRegex 무시 / 있으면 실행', String(t1.varsAfter.hp) + ',' + t2.varsAfter.hp, 'undefined,42');
    var t3 = await w.RisuSim.run({ mode: 'editprocess', input: 'a', chatID: 0, chat: [{ role: 'char', data: 'a' }],
      charTriggers: [{ comment: 'l', type: 'start', conditions: [], effect: [{ type: 'triggerlua', code: "function onStart(id) setChatVar(id, 'lua', 'ok') end" }] }] });
    eq('트리거 triggerlua → 원본 runScripted 경로로 Lua 실행', t3.varsAfter.lua, 'ok');

    // ---------- 표시 캐시 ----------
    w.RisuSim.resetScriptCache();
    var pr = [{ comment: 'v', in: 'X', out: '{{getvar::hp}}', type: 'editdisplay' }];
    var c1 = await w.RisuSim.run({ mode: 'editdisplay', input: 'X', markdown: false, presetRegex: pr, vars: { hp: '1' } });
    var c2 = await w.RisuSim.run({ mode: 'editdisplay', input: 'X', markdown: false, presetRegex: pr, vars: { hp: '2' } });
    eq('캐시 적중 → 이전 결과 (원본 processScriptCache)', c1.finalText + ',' + c2.finalText, '1,1');
    d.getElementById('cacheClear').click();
    await sleep(300);
    var c3 = await w.RisuSim.run({ mode: 'editdisplay', input: 'X', markdown: false, presetRegex: pr, vars: { hp: '2' } });
    eq('캐시 비우기 버튼', c3.finalText, '2');
    ok('표시 캐시 스위치 존재(기본 켜짐)', d.getElementById('featCache') && d.getElementById('featCache').checked);
  }
})();
</script>
</body>
</html>
